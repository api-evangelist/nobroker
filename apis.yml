aid: nobroker
name: NoBroker
description: 'NoBroker Technologies Solutions Pvt Ltd is an Indian proptech company,
  founded in 2013 and headquartered in Bengaluru, that operates a brokerage-free real
  estate marketplace connecting property owners directly with tenants and buyers across
  Indian metros. Beyond listings for flats, houses, villas, plots, PGs and commercial
  space, NoBroker sells adjacent home services — rental and lease agreement drafting,
  legal assistance, packers and movers, painting and cleaning, home loans and rent
  payments — and operates NoBrokerHood, a gated-community and housing-society management
  / ERP product covering visitor management, billing, accounting and complaints. NoBroker
  became India''s first proptech unicorn in 2021. The company ships software only as
  an end-user web and mobile product: as of this profile it publishes no public developer
  program, no API reference and no machine-readable specification, and its application
  endpoints under /api/v1..v5 are explicitly disallowed in robots.txt.'
